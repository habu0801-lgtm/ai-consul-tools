<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>Right-click each canvas and "Save image as" to save the icons.</p>
<script>
function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size / 2, cy = size / 2, r = size * 0.42;

  // Background
  ctx.fillStyle = '#0d0f14';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.2);
  ctx.fill();

  // Ring background
  ctx.strokeStyle = '#1e2330';
  ctx.lineWidth = size * 0.08;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // Ring progress (3/4)
  ctx.strokeStyle = '#4f8ef7';
  ctx.lineWidth = size * 0.08;
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(79,142,247,0.6)';
  ctx.shadowBlur = size * 0.1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, Math.PI);
  ctx.stroke();

  // Center dot
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#eef0f6';
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.06, 0, Math.PI * 2);
  ctx.fill();

  canvas.title = `icon${size}.png`;
  document.body.appendChild(canvas);
  document.body.appendChild(document.createTextNode(` icon${size}.png `));
  document.body.appendChild(document.createElement('br'));
}

[16, 48, 128].forEach(drawIcon);
</script>
</body>
</html>
